<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卸値ナビ</title>
    <link rel="icon" type="image/png" href="/portal/portal-title-logo.png?v=20251030oroshine">
    <link rel="stylesheet" href="/portal/portal.css?v=20251109lab2">
</head>
<body>
    <div id="portal-main" class="portal-main">
    <div class="container">
        <div class="portal-header">
            <div class="portal-header-text">
                <h1 id="portal-title" class="portal-title">
                    <span class="portal-title-logo-track">
                        <img
                            src="/portal/portal-title-logo.png?v=20251030oroshine"
                            alt="卸値ナビ（全国果樹卸売価格データ）"
                            class="portal-title-logo"
                            width="1024"
                            height="559"
                        >
                    </span>
                </h1>
                <p class="portal-brand-line">
                    <span class="portal-brand-message">中央卸売市場の取引価格です。直売の値付け参考にご利用ください。（小売実売ではありません）。</span>
                </p>
            </div>
        </div>

        <section class="fruit-market-section" id="fruit-market-section" aria-label="果物の卸売相場">
            <div class="fruit-market-header">
                <p class="fruit-market-meta">対象日: <span id="fruit-market-date">読み込み中…</span> <span class="fruit-market-meta-note">※おおむね15時頃更新</span></p>
            </div>

            <div class="fruit-market-controls">
                <fieldset class="fruit-market-fieldset">
                    <legend>市場</legend>
                    <div class="fruit-market-radio-row">
                        <label><input type="radio" name="fruit-market-city" value="5101"> 札幌</label>
                        <label><input type="radio" name="fruit-market-city" value="0401"> 仙台</label>
                        <label><input type="radio" name="fruit-market-city" value="1301" checked> 東京</label>
                        <label><input type="radio" name="fruit-market-city" value="1401"> 横浜</label>
                        <label><input type="radio" name="fruit-market-city" value="2301"> 名古屋</label>
                        <label><input type="radio" name="fruit-market-city" value="2601"> 京都</label>
                        <label><input type="radio" name="fruit-market-city" value="2701"> 大阪</label>
                        <label><input type="radio" name="fruit-market-city" value="4002"> 福岡</label>
                    </div>
                </fieldset>
                <div class="fruit-market-fruit-row" role="tablist" aria-label="果物">
                    <button type="button" class="fruit-market-fruit-btn is-active" data-fruit-key="apple">りんご</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="pear">なし</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="grape">ぶどう</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="kiwi">キウイ</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="mikan">みかん</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="persimmon">かき</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="peach">もも</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="strawberry">いちご</button>
                    <button type="button" class="fruit-market-fruit-btn" data-fruit-key="melon">メロン</button>
                </div>
            </div>

            <div id="fruit-market-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>卸売相場データを取得中...</p>
            </div>
            <div id="fruit-market-error" class="error hidden"></div>

            <div class="fruit-market-summary-block">
                <h3 class="fruit-market-subtitle">市場比較（当該果物）</h3>
                <div id="fruit-market-summary" class="fruit-market-summary-grid"></div>
            </div>

            <div class="fruit-market-detail-block">
                <div class="fruit-market-detail-head">
                    <h3 class="fruit-market-subtitle" id="fruit-market-detail-title">産地別一覧</h3>
                    <label class="fruit-market-sort-label">
                        並べ替え
                        <select id="fruit-market-sort">
                            <option value="volume">取引量（多い順）</option>
                            <option value="price-desc">価格（高い順）</option>
                            <option value="price-asc">価格（安い順）</option>
                        </select>
                    </label>
                </div>
                <div id="fruit-market-table-area"></div>
            </div>

            <p class="fruit-market-source">出典: 青果物卸売市場調査（農林水産省）</p>
        </section>

        <section class="fruit-retail-section" id="fruit-retail-section" aria-label="果樹の小売価格">
            <div class="fruit-retail-header">
                <h2 class="fruit-retail-title">果樹の小売価格（参考）</h2>
                <p class="fruit-retail-lead">スーパー等での<strong>小売</strong>全国平均（税込・特売除く）です。上の卸売相場とは調査方法が異なります。</p>
                <p class="fruit-retail-meta" id="fruit-retail-meta">調査月: 読み込み中…</p>
            </div>

            <div class="fruit-retail-fruit-row" role="tablist" aria-label="果樹品目">
                <button type="button" class="fruit-retail-fruit-btn is-active" data-retail-fruit-key="apple">りんご</button>
                <button type="button" class="fruit-retail-fruit-btn" data-retail-fruit-key="mikan">みかん</button>
                <button type="button" class="fruit-retail-fruit-btn" data-retail-fruit-key="grape">ぶどう</button>
                <button type="button" class="fruit-retail-fruit-btn" data-retail-fruit-key="pear">日本なし</button>
                <button type="button" class="fruit-retail-fruit-btn" data-retail-fruit-key="peach">もも</button>
            </div>

            <div id="fruit-retail-loading" class="loading hidden">
                <div class="spinner"></div>
                <p>小売価格データを取得中...</p>
            </div>
            <div id="fruit-retail-error" class="error hidden"></div>
            <div id="fruit-retail-panel" class="fruit-retail-panel"></div>

            <p class="fruit-retail-source">出典: <a href="https://www.maff.go.jp/j/zyukyu/anpo/kouri/kouri/kajyu.html" target="_blank" rel="noopener noreferrer">食品価格動向調査（果樹）</a>（農林水産省）</p>
        </section>

        <footer>
            <p class="portal-lab-entry footer-lab-entry">
                <a href="/portal/lab/" class="portal-lab-entry-link">実験中</a>
            </p>
            <p class="footer-gp">
                <span class="footer-gp-link footer-gp-brand">
                    <img src="/portal/farmlabo-logo.jpg?v=20251030" alt="FarmLabo" class="footer-gp-logo" width="200" height="200">
                    <span class="footer-gp-name">FarmLabo</span>
                </span>
            </p>
            <p class="footer-version">v0.1.0</p>
        </footer>
    </div>
    </div>

    <script src="/portal/fruit-market-ui.js?v=20251102v002"></script>
    <script src="/portal/fruit-retail-trend-ui.js?v=20251105v001"></script>
</body>
</html>
