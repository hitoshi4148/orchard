<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="りんご・日本なし栽培向けの感染危険予報と発病予測（気象データ連携は順次実装）">
  <meta name="robots" content="noindex, nofollow">
  <title>果樹園しごと・りんご・日本なし病害リスク予報</title>
  <link rel="icon" type="image/png" href="/portal/portal-title-logo.png">
  <link rel="stylesheet" href="../portal.css">
  <link rel="stylesheet" href="apple-risk.css?v=20251109p1">
</head>
<body>
  <div class="apple-risk-page">
    <p class="apple-risk-back"><a href="/portal/lab/">← 果樹園しごと（実験）</a></p>

    <div id="apple-risk-root" aria-live="polite"></div>

    <footer class="risk-footer" style="margin-top:24px;text-align:center;font-size:0.8rem;color:#6b7280">
      <p>気象データ: MET Norway（予報）+ NASA POWER（履歴・GDD） ｜ 一部病害は簡易モデル／未接続</p>
      <p class="footer-version">りんご・日本なし病害リスク UI v0.2</p>
    </footer>
  </div>

  <div id="apple-risk-location-modal" class="apple-risk-modal hidden" role="dialog" aria-modal="true" aria-labelledby="loc-modal-title">
    <div id="apple-risk-modal-backdrop" class="apple-risk-modal-backdrop"></div>
    <div class="apple-risk-modal-panel">
      <h2 id="loc-modal-title" style="margin:0 0 8px;font-size:1.05rem;color:#14532d">予報地点の設定</h2>
      <p style="margin:0 0 8px;font-size:0.82rem;color:#6b7280">都道府県・市町村と座標を保存します（端末のローカルストレージ）。</p>
      <label for="loc-prefecture">都道府県</label>
      <input type="text" id="loc-prefecture" autocomplete="address-level1" placeholder="例: 群馬県">
      <label for="loc-municipality">市町村</label>
      <input type="text" id="loc-municipality" autocomplete="address-level2" placeholder="例: 前橋市">
      <label for="loc-lat">緯度（任意）</label>
      <input type="text" id="loc-lat" inputmode="decimal" placeholder="例: 36.39">
      <label for="loc-lon">経度（任意）</label>
      <input type="text" id="loc-lon" inputmode="decimal" placeholder="例: 139.06">
      <div class="apple-risk-modal-actions">
        <button type="button" class="apple-risk-btn" id="apple-risk-modal-cancel">キャンセル</button>
        <button type="button" class="apple-risk-btn" style="background:#15803d;color:#fff;border-color:#15803d" id="apple-risk-modal-save">保存</button>
      </div>
    </div>
  </div>

  <script src="apple-risk-model.js?v=20251109p2"></script>
  <script src="apple-risk-app.js?v=20251109p2"></script>
</body>
</html>
